<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">10月31日 お店やさん最終ボーダー確定</title>
  <desc id="desc">ツムツムのランタンショップ最終ボーダーと、12.11.0アップデートの確認ポイントをまとめた記事の図解</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#073c70"/>
      <stop offset="1" stop-color="#061d39"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe88a"/>
      <stop offset="1" stop-color="#ffc44c"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <path d="M0 582h1280v138H0z" fill="#08294e"/>
  <path d="M0 576h1280" stroke="url(#gold)" stroke-width="8"/>
  <circle cx="1076" cy="171" r="112" fill="#0d5083" stroke="#59d8c6" stroke-width="5"/>
  <circle cx="1076" cy="171" r="84" fill="#083962" stroke="#b9f4eb" stroke-width="3"/>
  <text x="1076" y="155" fill="#d9fff8" font-family="system-ui,sans-serif" font-size="24" font-weight="700" text-anchor="middle">10.31</text>
  <text x="1076" y="207" fill="#fff" font-family="system-ui,sans-serif" font-size="39" font-weight="900" text-anchor="middle">06:00</text>
  <text x="84" y="126" fill="#65e3cf" font-family="system-ui,sans-serif" font-size="28" font-weight="800" letter-spacing="2">TSUM TSUM / OCTOBER 31</text>
  <text x="80" y="267" fill="#fff" font-family="system-ui,sans-serif" font-size="76" font-weight="900">最終ボーダー</text>
  <text x="80" y="367" fill="#fff" font-family="system-ui,sans-serif" font-size="76" font-weight="900">確定後に見ること</text>
  <text x="86" y="454" fill="#ffe28a" font-family="system-ui,sans-serif" font-size="34" font-weight="800">ランタンショップ ＋ 12.11.0更新</text>
  <g fill="#fff" font-family="system-ui,sans-serif" font-size="24" font-weight="700">
    <text x="86" y="642">公式情報とプレイ動画を、重複なしで確認</text>
    <text x="1168" y="642" text-anchor="end">ふめいだよラボ</text>
  </g>
  <g fill="#ffd46c">
    <circle cx="111" cy="526" r="11"/><circle cx="149" cy="526" r="11"/><circle cx="187" cy="526" r="11"/>
  </g>
</svg>
