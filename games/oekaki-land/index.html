<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,follow">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#7ed7ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="おえかきランド">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/lab-integration.css">
  <title>おえかきランド</title>
</head>
<body>
  <div id="orientation-lock">
    <div class="rotate-card">
      <div class="rotate-icon">📱↔️</div>
      <h1>よこにしてね</h1>
      <p>スマホを よこむきに してあそぼう！</p>
    </div>
  </div>

  <div id="app" class="app-shell">
    <header id="topbar" class="topbar hidden">
      <button id="backBtn" class="pill-btn back-btn" aria-label="もどる">← <span>もどる</span></button>
      <div id="screenTitle" class="screen-title"></div>
      <button id="speakBtn" class="round-btn speak-btn hidden" aria-label="きく">🔊<span>きく</span></button>
    </header>

    <main id="screen" class="screen"></main>

    <button id="adultBtn" class="adult-btn" aria-label="おとな設定">⚙️ <span>せってい</span></button>
  </div>

  <div id="toast" class="toast"></div>

  <div id="successOverlay" class="success-overlay hidden">
    <div class="success-card">
      <div class="hanamaru">⭕</div>
      <div id="successWord" class="success-word">じょうず！</div>
      <div class="sparkles">👏 ✨ 👏 ✨ 👏</div>
      <div class="success-actions">
        <button id="againBtn" class="big-action secondary">🔄 もういちど</button>
        <button id="nextBtn" class="big-action primary">つぎへ →</button>
      </div>
    </div>
  </div>

  <div id="settingsModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card settings-card">
      <div class="modal-head">
        <h2>⚙️ おとな設定</h2>
        <button id="closeSettings" class="round-btn small">✕</button>
      </div>

      <label class="setting-block">
        <span>おなまえ <small>（最大12文字）</small></span>
        <input id="nameInput" maxlength="12" autocomplete="off" inputmode="text" placeholder="ここに なまえを いれてね">
      </label>

      <div class="setting-block">
        <span>おなまえの おてほん</span>
        <div class="segmented" id="difficultyGroup">
          <button data-value="easy">やさしい</button>
          <button data-value="normal">ふつう</button>
          <button data-value="light">うすめ</button>
        </div>
      </div>

      <div class="setting-grid">
        <label class="toggle-row"><span>🎵 BGM</span><input id="bgmToggle" type="checkbox"><i></i></label>
        <label class="toggle-row"><span>🔔 こうかおん</span><input id="sfxToggle" type="checkbox"><i></i></label>
      </div>

      <div class="settings-actions">
        <button id="saveSettings" class="big-action primary">💾 ほぞん</button>
        <button id="resetSettings" class="big-action danger">🧹 せっていリセット</button>
      </div>
      <p class="settings-note">※ ホームの「⚙️ せってい」から、いつでも名前を変更できます。</p>
    </div>
  </div>

  <script src="./js/orientation.js?v=20260930-1"></script>
  <script src="./js/data.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
