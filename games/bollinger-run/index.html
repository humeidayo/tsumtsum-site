<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#070a0d"><meta name="description" content="日経平均の実際の過去相場を駆け抜けるボリンジャーバンド・サバイバルゲーム。初心者3σ／上級者1.5σ。"><title>BOLLINGER RUN</title><link rel="stylesheet" href="styles.css"></head><body>
<main class="app-shell"><header class="topbar"><div style="display:flex;align-items:center;gap:10px"><a href="../../index.html" aria-label="ふめいだよラボへ戻る" title="ふめいだよラボへ戻る" style="display:grid;place-items:center;width:30px;height:30px;border:1px solid #3a4650;color:#dfe5e9;text-decoration:none;font-weight:900">↩</a><button class="brand" id="brandBtn" type="button"><span class="brand-mark">BR</span><span>BOLLINGER RUN</span></button></div><div class="top-actions"><button id="langBtn" class="icon-btn" type="button">日本語 / EN</button><button id="soundBtn" class="icon-btn" type="button">SOUND ON</button></div></header>
<section id="homeScreen" class="screen home-screen active"><div class="home-core"><p class="eyebrow">GAME 002</p><h1>BOLLINGER<br><span>RUN</span></h1><div class="market-lock"><b data-i18n="nikkei">日経平均</b><small>2010 → 2026.08</small></div><div class="market-grid" role="radiogroup" aria-label="difficulty"><button class="market-card selected" data-mode="beginner" type="button"><b data-i18n="beginner">初心者</b><small>±3σ</small></button><button class="market-card" data-mode="advanced" type="button"><b data-i18n="advanced">上級者</b><small>±1.5σ</small></button></div><input id="nickname" maxlength="14" autocomplete="nickname" placeholder="ランキング名"><button id="startBtn" class="primary-btn" type="button">START</button></div><section class="ranking-preview"><div class="section-title-row"><span id="homeRankingTitle">初心者ランキング</span><button id="refreshHomeRanking" class="text-btn" type="button">更新</button></div><div id="homeRanking" class="ranking-list"></div></section></section>
<section id="gameScreen" class="screen game-screen"><div class="game-hud"><div><span data-i18n="market">MARKET</span><strong id="hudMarket">日経平均</strong></div><div><span data-i18n="date">DATE</span><strong id="hudDate">2010.02</strong></div><div><span data-i18n="index">INDEX</span><strong id="hudValue">10,000円</strong></div><div><span data-i18n="level">LEVEL</span><strong id="hudLevel">001</strong></div><div><span data-i18n="time">TIME</span><strong id="hudTime">00:00</strong></div></div><div class="canvas-wrap"><canvas id="gameCanvas"></canvas><div id="countdown" class="countdown hidden">3</div><div id="eventBanner" class="event-banner hidden"><small id="eventDate"></small><b id="eventTitle"></b><span id="eventComment"></span></div><div id="moveFlash" class="move-flash hidden"><small id="moveLabel">前日比</small><b id="movePct">-20.5%</b><span id="moveDate"></span></div><div class="control-hint">TAP / HOLD</div></div><div class="progress-track"><div id="progressBar"></div></div></section>
<section id="resultScreen" class="screen result-screen"><div class="result-card"><p id="resultOverline" class="eyebrow">RUN ENDED</p><h1 id="resultTitle">BAND OUT</h1><div class="result-main"><strong id="resultDate"></strong><em id="resultValue"></em></div><div class="result-stats"><div><span>PROGRESS</span><strong id="resultProgress"></strong></div><div><span>TIME</span><strong id="resultTime"></strong></div><div><span>BEST</span><strong id="resultBest"></strong></div></div><div class="result-actions"><button id="retryBtn" class="primary-btn" type="button">RETRY</button><button id="homeBtn" class="secondary-btn" type="button">HOME</button></div></div><section class="result-ranking"><div class="section-title-row"><span id="rankingTitle"></span><button id="refreshResultRanking" class="text-btn" type="button">更新</button></div><div id="resultRanking" class="ranking-list"></div></section></section></main>
<script src="data/market-data.js"></script><script src="game.js"></script></body></html>
